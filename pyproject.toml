[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "volterra-py"
dynamic = ["version"]
description = "Python bindings for the volterra active matter simulation library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["active-matter", "nematohydrodynamics", "liquid-crystals", "simulation", "physics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy >= 1.24",
]

[tool.maturin]
# Build the volterra-py crate (not the facade library crate)
manifest-path = "volterra-py/Cargo.toml"
# The lib.name in volterra-py/Cargo.toml is "volterra", so the Python
# module is imported as `import volterra`.
module-name = "volterra.volterra"
# Mixed layout: the package directory ships the stubs and `py.typed` beside the
# extension, so an installed wheel is typed. Kept in step with the same keys in
# volterra-py/pyproject.toml, which is the file the release workflow builds
# against (`--manifest-path volterra-py/Cargo.toml`).
python-source = "volterra-py/python"
# Always build with --release for scientific workloads
profile = "release"
# stub files live alongside the .so, not in a separate source tree

[project.optional-dependencies]
dev = [
    "maturin >= 1.5",
    "pytest >= 7.0",
    "matplotlib >= 3.7",
    "scipy >= 1.10",
]

[tool.pyrefly]
# Full Pyrefly type checking rather than the degraded basic preset.
