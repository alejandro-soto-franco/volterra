# crates.io publishing, kept OUT of release.yml.
#
# release.yml builds and publishes the Python wheels, and PyPI trusted
# publishing is bound to that workflow's FILENAME. Renaming or folding it would
# break the publisher until it is repointed by hand on pypi.org, which cannot be
# done from this repository. So the two publishing paths stay separate.
#
# Order is the dependency order: core, then braid, then the two backends, then
# the facade. `volterra-py` is excluded on purpose, since a pyo3 extension is
# consumed as a wheel rather than as a Cargo dependency.
name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for a re-fire after a partial failure"
        required: true
        type: string

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.89
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in volterra-core volterra-braid volterra-dec volterra-fd volterra; do
            echo "::group::$crate"
            # An already-published version is not a failure: a re-fire after a
            # partial run has to be able to skip what already landed.
            if cargo publish -p "$crate"; then
              echo "$crate published"
            else
              cargo search "$crate" --limit 1
              echo "$crate failed or was already published, check the line above"
              exit 1
            fi
            # crates.io needs a moment to index before a dependent resolves.
            sleep 45
            echo "::endgroup::"
          done
