name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (aarch64 only)
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path volterra-py/Cargo.toml
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  # Free-threaded CPython has no stable ABI, so it gets its own cp314t wheel.
  # continue-on-error keeps a failure here from holding back the abi3 wheels,
  # which every other interpreter installs.
  build-wheels-free-threaded:
    continue-on-error: true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (aarch64 only)
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Set up CPython 3.14t (macOS and Windows)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14t"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path volterra-py/Cargo.toml -i python3.14t
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-ft-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  publish-pypi:
    needs: [build-wheels, build-wheels-free-threaded]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
