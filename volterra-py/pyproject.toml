[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "volterra-py"
requires-python = ">=3.10"
dependencies = ["numpy>=1.20"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["version"]
description = "Python bindings for the volterra active matter simulation library"
license = { text = "MIT" }

[tool.maturin]
features = []
manifest-path = "Cargo.toml"
module-name = "volterra.volterra"
# Mixed layout: the package directory ships the stubs and `py.typed` beside the
# extension, so an installed wheel is typed.
python-source = "python"
