[workspace]
resolver = "2"
members = [
    "volterra",
    "volterra-braid",
    "volterra-core",
    "volterra-dec",
    "volterra-fd",
    "volterra-py",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/alejandro-soto-franco/volterra"
homepage = "https://github.com/alejandro-soto-franco/volterra"
documentation = "https://docs.rs/volterra"
readme = "README.md"
keywords = ["active-matter", "nematohydrodynamics", "riemannian", "simulation", "physics"]
categories = ["science", "mathematics", "simulation"]

[workspace.dependencies]
# The internal crates carry their version here and nowhere else. Nine
# hard-coded pins across four manifests is how a bump leaves one behind,
# and `cargo publish` is where that surfaces.
volterra-core    = { path = "volterra-core",   version = "0.4.0" }
volterra-braid   = { path = "volterra-braid",  version = "0.4.0" }
volterra-dec     = { path = "volterra-dec",    version = "0.4.0" }
volterra-fd      = { path = "volterra-fd",     version = "0.4.0" }

cartan-core      = "0.6.1"
cartan-manifolds = "0.6"
cartan-geo       = "0.6"
cartan-dec       = "0.6"
cartan-remesh    = "0.6"

nalgebra         = { version = "0.35", features = ["std"] }
rayon            = "1"
thiserror        = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
approx           = "0.5"
rand             = "0.10"
rustfft          = "6"
pyo3             = { version = "0.28", features = ["extension-module", "abi3-py310"] }
numpy            = "0.28"
criterion        = "0.8"

# Uncomment and point at a local checkout to build against in-tree cartan
# changes without pushing them first.
# [patch.crates-io]
# cartan-core      = { path = "../cartan/cartan-core" }
# cartan-manifolds = { path = "../cartan/cartan-manifolds" }
# cartan-geo       = { path = "../cartan/cartan-geo" }
# cartan-dec       = { path = "../cartan/cartan-dec" }
# cartan-remesh    = { path = "../cartan/cartan-remesh" }

# The numerics tests solve real linear systems on real meshes, so an
# unoptimised test build does not finish in a usable time: the confined LdG
# suite ran for over an hour under `opt-level = 0` and was still going.
[profile.test]
opt-level = 2
